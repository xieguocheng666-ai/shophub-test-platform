# 购物车加购边界测试数据
# store_role/product_role是本例catalog的资源角色，运行时取得实际编号；数量与预期保持原边界。
insufficient_stock:
  - id: 库存不足
    store_role: s1
    product_role: p4
    quantity: 999
    expect_code: 400
    expect_detail: "库存不足"

invalid_quantity:
  - id: 数量负数
    store_role: s1
    product_role: p1
    quantity: -1
    expect_code: 400
    expect_detail: "数量必须大于 0"
  - id: 数量非法
    store_role: s1
    product_role: p1
    quantity: 0
    expect_code: 400
    expect_detail: "数量必须大于 0"

nonexistent_product:
  - id: 商品不存在
    store_role: s1
    product_role: missing_product
    quantity: 1
    expect_code: 404
    expect_detail: "商品不存在"
