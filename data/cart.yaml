# 购物车加购边界测试数据
# 字段：store_id / product_id / quantity / expect_code / expect_detail（错误详情关键字）
insufficient_stock:
  - id: 库存不足
    store_id: 1
    product_id: 4
    quantity: 999
    expect_code: 400
    expect_detail: "库存不足"

invalid_quantity:
  - id: 数量负数
    store_id: 1
    product_id: 1
    quantity: -1
    expect_code: 400
    expect_detail: "数量必须大于 0"
  - id: 数量非法
    store_id: 1
    product_id: 1
    quantity: 0
    expect_code: 400
    expect_detail: "数量必须大于 0"

nonexistent_product:
  - id: 商品不存在
    store_id: 1
    product_id: 9999
    quantity: 1
    expect_code: 404
    expect_detail: "商品不存在"
