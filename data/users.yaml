# 登录接口参数化测试数据（api 模块阶段启用）
# 字段：username / password / expect_code / expect_detail（错误详情关键字，成功用例为 null）
valid_login:
  - id: 合法登录
    username: alice
    password: alice123
    expect_code: 200
    expect_detail: null

invalid_password:
  - id: 密码错误
    username: alice
    password: wrong-pass
    expect_code: 401
    expect_detail: "用户名或密码错误"

unknown_user:
  - id: 用户不存在
    username: nobody
    password: whatever
    expect_code: 401
    expect_detail: "用户名或密码错误"
