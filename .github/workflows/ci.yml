name: CI

on:
  push:
    branches: [main, master, improve-test-design]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run unit regressions without external services
        run: python -m tools.run_tests --suite unit --run-id unit-${{ github.run_id }}-${{ github.run_attempt }} -- -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: reports/engineering/
          retention-days: 14
          if-no-files-found: warn

  integration:
    needs: unit
    strategy:
      matrix:
        workers: [1, 2]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-demo-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-ci-demo-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: local-ci-demo-password
      SECRET_KEY: local-ci-demo-signing-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run full regression in an owned environment
        run: python -m tools.run_tests --suite all --workers ${{ matrix.workers }} --run-id integration-${{ github.run_id }}-${{ github.run_attempt }} -- -q --browser chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ matrix.workers }}
          path: reports/engineering/
          retention-days: 14
          if-no-files-found: warn
